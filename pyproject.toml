[project]
name = "depaudit"
version = "0.1.0"
description = "Find supply-chain risks in npm and pip dependency files: install hooks, non-registry sources, insecure URLs, typosquats."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Baran Ayaztas" }]
keywords = ["supply-chain", "security", "npm", "pip", "dependencies", "typosquat",
            "devsecops", "static-analysis", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["click>=8.1", "rich>=13.7"]

[project.urls]
Homepage = "https://github.com/ReazGan/depaudit"
Issues = "https://github.com/ReazGan/depaudit/issues"

[project.scripts]
depaudit = "depaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["depaudit*"]
